<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">
        <h2>Currency Converter</h2>
        <form>
            <div class="amount">
                <p>enter amount</p>
                <input type="text" value="">
            </div>
            <div class="dropdown">
                <div class="from">
                    <p>From</p>
                    <div class="select-container">
                        <img src="https://flagsapi.com/US/flat/64.png" alt="">
                        <select name="from" id="">
                            
                        </select>
                    </div>
                </div>
                <div class="to">
                    <p>To</p>
                    <div class="select-container">
                        <img src="https://flagsapi.com/BD/flat/64.png" alt="">
                        <select name="to" id="">
                            
                            <option value="BD" selected>BD</option>
                        </select>
                    </div>
                </div>
            </div>

            <button>Get Exchange Rate</button>
        </form>
        <div class="message">
            <p class="msg"></p>

        </div>
        
    </div>

    <script src="codes.js"></script>
    <script src="script.js"></script>
</body>
</html>
