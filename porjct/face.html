<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facial Expression Detector</title>
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Syne+Mono&display=swap');

  :root {
    --bg: #0d0d0d;
    --panel: #141414;
    --border: rgba(255,255,255,0.08);
    --accent: #f5c842;
    --text: #f0ede6;
    --muted: rgba(240,237,230,0.35);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  /* Grain overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    opacity: 0.4;
    z-index: 100;
  }

  header {
    text-align: center;
    margin-bottom: 32px;
  }

  header h1 {
    font-size: clamp(1.6rem, 5vw, 2.8rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1;
  }

  header h1 span { color: var(--accent); }

  header p {
    font-family: 'Syne Mono', monospace;
    font-size: 0.75rem;
    color: var(--muted);
    letter-spacing: 0.15em;
    margin-top: 8px;
    text-transform: uppercase;
  }

  .app {
    display: flex;
    gap: 28px;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
    max-width: 1000px;
  }

  /* Video panel */
  .video-panel {
    position: relative;
    flex-shrink: 0;
  }

  .video-frame {
    position: relative;
    border: 1px solid var(--border);
    background: #000;
  }

  /* Corner accents */
  .video-frame::before, .video-frame::after,
  .corner-br, .corner-tl2 {
    content: '';
    position: absolute;
    width: 16px; height: 16px;
    border-color: var(--accent);
    border-style: solid;
    z-index: 5;
  }
  .video-frame::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
  .video-frame::after  { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }
  .corner-br { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
  .corner-tl2 { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }

  #video {
    display: block;
    width: 440px;
    max-width: 90vw;
    aspect-ratio: 4/3;
    transform: scaleX(-1);
    object-fit: cover;
  }

  #overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    transform: scaleX(-1);
    pointer-events: none;
  }

  /* Scan line animation */
  .scanline {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0;
    animation: scan 3s linear infinite;
    z-index: 4;
  }

  @keyframes scan {
    0%   { top: 0%; opacity: 0.6; }
    95%  { top: 100%; opacity: 0.6; }
    100% { top: 100%; opacity: 0; }
  }

  /* Results panel */
  .results-panel {
    flex: 1;
    min-width: 260px;
    max-width: 360px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* Big emoji display */
  .emoji-display {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    position: relative;
    overflow: hidden;
  }

  .emoji-display::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 50%, rgba(245,200,66,0.06), transparent 70%);
  }

  .main-emoji {
    font-size: 72px;
    line-height: 1;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    filter: drop-shadow(0 0 20px rgba(245,200,66,0.4));
  }

  .main-label {
    font-size: 1.4rem;
    font-weight: 800;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--accent);
    transition: all 0.3s ease;
  }

  .confidence-text {
    font-family: 'Syne Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  /* Expression bars */
  .bars-section {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 20px;
  }

  .bars-title {
    font-family: 'Syne Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .expr-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .expr-emoji { font-size: 1rem; width: 24px; text-align: center; }

  .expr-name {
    font-family: 'Syne Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    text-transform: uppercase;
    width: 72px;
    flex-shrink: 0;
  }

  .bar-track {
    flex: 1;
    height: 4px;
    background: rgba(255,255,255,0.06);
    border-radius: 2px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.25s ease;
    background: rgba(255,255,255,0.2);
  }

  .bar-fill.dominant {
    background: var(--accent);
    box-shadow: 0 0 8px rgba(245,200,66,0.6);
  }

  .bar-val {
    font-family: 'Syne Mono', monospace;
    font-size: 0.6rem;
    color: var(--muted);
    width: 36px;
    text-align: right;
  }

  /* Face info */
  .face-info {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
  }

  .info-item { text-align: center; }

  .info-val {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--accent);
  }

  .info-key {
    font-family: 'Syne Mono', monospace;
    font-size: 0.6rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-top: 2px;
  }

  /* Status */
  .status {
    font-family: 'Syne Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-align: center;
    text-transform: uppercase;
  }

  .status .dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--muted);
    margin-right: 6px;
    vertical-align: middle;
  }

  .status.active .dot {
    background: #4ade80;
    box-shadow: 0 0 8px #4ade80;
    animation: blink 1.2s ease infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* Start button */
  #startBtn {
    font-family: 'Syne', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 14px 48px;
    background: var(--accent);
    color: #0d0d0d;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
    display: block;
    margin: 0 auto;
  }

  #startBtn:hover {
    background: #fff;
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(245,200,66,0.3);
  }

  .loading-bar {
    width: 100%;
    height: 2px;
    background: var(--border);
    overflow: hidden;
    margin-top: 12px;
  }

  .loading-bar-inner {
    height: 100%;
    background: var(--accent);
    animation: loading 1.8s ease-in-out infinite;
    display: none;
  }

  @keyframes loading {
    0% { width: 0; margin-left: 0; }
    50% { width: 60%; margin-left: 20%; }
    100% { width: 0; margin-left: 100%; }
  }
</style>
</head>
<body>

<header>
  <h1>FACE <span>EMOTION</span> DETECTOR</h1>
  <p>Real-time expression recognition via AI</p>
</header>

<div id="startScreen" style="text-align:center;">
  <button id="startBtn" onclick="init()">Start Camera</button>
  <div class="loading-bar"><div class="loading-bar-inner" id="loadBar"></div></div>
  <p style="font-family:'Syne Mono',monospace;font-size:0.7rem;color:var(--muted);margin-top:12px;letter-spacing:0.1em;" id="loadMsg">CLICK TO BEGIN</p>
</div>

<div class="app" id="mainApp" style="display:none;">

  <div class="video-panel">
    <div class="video-frame">
      <div class="corner-br"></div>
      <div class="corner-tl2"></div>
      <div class="scanline"></div>
      <video id="video" autoplay muted playsinline></video>
      <canvas id="overlay"></canvas>
    </div>
  </div>

  <div class="results-panel">

    <div class="emoji-display">
      <div class="main-emoji" id="mainEmoji">😐</div>
      <div class="main-label" id="mainLabel">Scanning...</div>
      <div class="confidence-text" id="mainConf">confidence: —</div>
    </div>

    <div class="bars-section">
      <div class="bars-title">All Expressions</div>
      <div id="barsContainer"></div>
    </div>

    <div class="face-info">
      <div class="info-item">
        <div class="info-val" id="faceCount">0</div>
        <div class="info-key">Faces</div>
      </div>
      <div class="info-item">
        <div class="info-val" id="ageVal">—</div>
        <div class="info-key">Est. Age</div>
      </div>
      <div class="info-item">
        <div class="info-val" id="genderVal">—</div>
        <div class="info-key">Gender</div>
      </div>
    </div>

    <div class="status" id="statusBar">
      <span class="dot"></span> Initializing...
    </div>

  </div>
</div>

<script>
const EXPRESSIONS = {
  happy:     { emoji: '😄', label: 'Happy'     },
  sad:       { emoji: '😢', label: 'Sad'       },
  angry:     { emoji: '😠', label: 'Angry'     },
  fearful:   { emoji: '😨', label: 'Fearful'   },
  disgusted: { emoji: '🤢', label: 'Disgusted' },
  surprised: { emoji: '😲', label: 'Surprised' },
  neutral:   { emoji: '😐', label: 'Neutral'   },
};

const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model';

// Build bars
const barsContainer = document.getElementById('barsContainer');
Object.entries(EXPRESSIONS).forEach(([key, val]) => {
  barsContainer.innerHTML += `
    <div class="expr-row" id="row-${key}">
      <span class="expr-emoji">${val.emoji}</span>
      <span class="expr-name">${val.label}</span>
      <div class="bar-track">
        <div class="bar-fill" id="bar-${key}" style="width:0%"></div>
      </div>
      <span class="bar-val" id="val-${key}">0%</span>
    </div>`;
});

async function init() {
  document.getElementById('startBtn').disabled = true;
  document.getElementById('loadBar').style.display = 'block';
  document.getElementById('loadMsg').textContent = 'LOADING AI MODELS...';

  try {
    await Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
      faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL),
      faceapi.nets.ageGenderNet.loadFromUri(MODEL_URL),
    ]);

    document.getElementById('loadMsg').textContent = 'STARTING CAMERA...';

    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
    const video = document.getElementById('video');
    video.srcObject = stream;

    await new Promise(r => video.addEventListener('loadeddata', r, { once: true }));

    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('mainApp').style.display = 'flex';

    const status = document.getElementById('statusBar');
    status.innerHTML = '<span class="dot"></span> Live';
    status.classList.add('active');

    detect(video);

  } catch (err) {
    document.getElementById('loadMsg').textContent = 'ERROR: ' + err.message;
    document.getElementById('startBtn').disabled = false;
  }
}

async function detect(video) {
  const canvas = document.getElementById('overlay');
  const ctx = canvas.getContext('2d');

  async function loop() {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const detections = await faceapi
      .detectAllFaces(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.4 }))
      .withFaceExpressions()
      .withAgeAndGender();

    document.getElementById('faceCount').textContent = detections.length;

    if (detections.length > 0) {
      const d = detections[0];
      const exprs = d.expressions;
      const box = d.detection.box;

      // Draw face box (mirrored)
      const mirroredX = canvas.width - box.x - box.width;
      ctx.strokeStyle = 'rgba(245,200,66,0.8)';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(mirroredX, box.y, box.width, box.height);

      // Corner marks
      const cs = 12;
      ctx.strokeStyle = '#f5c842';
      ctx.lineWidth = 2.5;
      [[mirroredX, box.y], [mirroredX+box.width, box.y],
       [mirroredX, box.y+box.height], [mirroredX+box.width, box.y+box.height]].forEach(([x,y], i) => {
        ctx.beginPath();
        const dx = i % 2 === 0 ? cs : -cs;
        const dy = i < 2 ? cs : -cs;
        ctx.moveTo(x + dx, y); ctx.lineTo(x, y); ctx.lineTo(x, y + dy);
        ctx.stroke();
      });

      // Find dominant expression
      let dominant = 'neutral', maxVal = 0;
      Object.entries(exprs).forEach(([k, v]) => { if (v > maxVal) { maxVal = v; dominant = k; } });

      // Update big display
      const info = EXPRESSIONS[dominant] || { emoji: '😐', label: dominant };
      document.getElementById('mainEmoji').textContent = info.emoji;
      document.getElementById('mainLabel').textContent = info.label;
      document.getElementById('mainConf').textContent = `confidence: ${(maxVal * 100).toFixed(1)}%`;

      // Update bars
      Object.entries(EXPRESSIONS).forEach(([key]) => {
        const pct = ((exprs[key] || 0) * 100).toFixed(1);
        const bar = document.getElementById('bar-' + key);
        bar.style.width = pct + '%';
        bar.className = 'bar-fill' + (key === dominant ? ' dominant' : '');
        document.getElementById('val-' + key).textContent = pct + '%';
      });

      // Age & gender
      document.getElementById('ageVal').textContent = Math.round(d.age);
      const g = d.gender;
      document.getElementById('genderVal').textContent = g === 'male' ? '♂' : '♀';

    } else {
      document.getElementById('mainEmoji').textContent = '👤';
      document.getElementById('mainLabel').textContent = 'No Face';
      document.getElementById('mainConf').textContent = 'show your face to the camera';
      document.getElementById('ageVal').textContent = '—';
      document.getElementById('genderVal').textContent = '—';
    }

    requestAnimationFrame(loop);
  }

  loop();
}
</script>
</body>
</html>
