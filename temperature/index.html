<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lesson</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="box">
      <div class="display">
        <label for="" class="text" id="text"></label>
      </div>
      <div class="check">
        <label><input type="checkbox" id="L"/> LowerCase</label>
        <label><input type="checkbox" id="U"/> UpperCase</label>
        <label><input type="checkbox" id="N"/> Numbers</label>
        <label><input type="checkbox" id="S"/> Symbols</label>
        <input type="range" id="slider" min="4" max="20" value="12" /><br />
        <label id="val">Password Length: <span id="value">12</span></label>
      </div>
      <button id="submit">GENERATE</button>
    </div>

    <script src="app.js"></script>
  </body>
</html>
